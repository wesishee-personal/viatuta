AWSTemplateFormatVersion: "2010-09-09"
Description: Viatuta single-host stack - one EC2 instance running docker compose behind Caddy, with a fixed public IP.

Parameters:
  GitHubRepo:
    Type: String
    Default: wesishee-personal/viatuta
    AllowedPattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
    Description: GitHub owner/repo allowed to assume the deploy role.
  GitHubEnvironment:
    Type: String
    Default: production
    Description: GitHub Actions environment the deploy job runs in. The role trusts only this environment.
  ExistingOidcProviderArn:
    Type: String
    Default: ""
    Description: ARN of an existing token.actions.githubusercontent.com OIDC provider. Leave empty to create one (an account can only have one).
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.small, t3.micro, t3.medium]
    Description: t3.small (2 GiB) is the smallest size that comfortably fits Postgres plus the in-memory routing graph. x86_64 only - the postgis image has no arm64 build.
  VolumeSizeGiB:
    Type: Number
    Default: 30
    MinValue: 20
    MaxValue: 100
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: >-
      Amazon Linux 2023 x86_64 AMI. Deliberately an explicit ID, not the "latest" SSM
      parameter: a changed ImageId replaces the instance, and the database lives on its
      root disk. To adopt a newer AMI, back up first, then pass the new ID (look it up
      with: aws ssm get-parameter --name /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64).

Conditions:
  CreateOidcProvider: !Equals [!Ref ExistingOidcProviderArn, ""]

Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Viatuta web (80/443); no inbound SSH, shell access is via SSM Session Manager
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTP (ACME challenge and redirect) }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS }
        - { IpProtocol: udp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTP/3 }
      Tags:
        - { Key: Project, Value: viatuta }

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Lets the SSM agent register, receive Run Command (the deploy path) and
        # open Session Manager shells; grants nothing else.
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: read-app-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadViatutaSecretsOnly
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource:
                  - !Ref PostgresPasswordSecret
                  - !Ref JwtSecret
                Condition:
                  Bool: { "aws:SecureTransport": "true" }
              - Sid: DecryptViatutaSecretsOnly
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                Resource: !GetAtt SecretsKey.Arn
                Condition:
                  Bool: { "aws:SecureTransport": "true" }
                  StringEquals: { "kms:ViaService": !Sub "secretsmanager.${AWS::Region}.amazonaws.com" }
      Tags:
        - { Key: Project, Value: viatuta }

  # Dedicated key for the app secrets. Only the account root is named in the key
  # policy (it delegates to IAM), which also keeps the key from depending on the
  # instance role. The role's own policy above grants it Decrypt.
  SecretsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Encrypts the Viatuta app secrets in Secrets Manager
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountAdmin
            Effect: Allow
            Principal: { AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root" }
            Action: "kms:*"
            Resource: "*"
      Tags:
        - { Key: Project, Value: viatuta }

  SecretsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/viatuta-secrets
      TargetKeyId: !Ref SecretsKey

  # Generated by Secrets Manager at creation: the value never appears in the
  # template, in CloudFormation, or in any terminal. Rotation is off for now:
  # rotating the Postgres password would also have to change it inside the database.
  PostgresPasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: viatuta/production/postgres-password
      Description: Postgres password for the Viatuta production database
      KmsKeyId: !Ref SecretsKey
      GenerateSecretString:
        PasswordLength: 32
        ExcludePunctuation: true
      Tags:
        - { Key: Project, Value: viatuta }

  JwtSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: viatuta/production/jwt-secret
      Description: HMAC secret used to sign Viatuta API JWTs
      KmsKeyId: !Ref SecretsKey
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true
      Tags:
        - { Key: Project, Value: viatuta }

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!GetAtt SecurityGroup.GroupId]
      Monitoring: false
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 2
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref VolumeSizeGiB
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y docker
          systemctl enable --now docker
          usermod -aG docker ec2-user
          # Compose v2 plugin (not packaged in AL2023).
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fSL "https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64" \
            -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          # 2 GiB swap so Postgres + the routing graph survive memory spikes.
          fallocate -l 2G /swapfile
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
          echo '/swapfile none swap sw 0 0' >> /etc/fstab
          install -d -o ec2-user -g ec2-user /home/ec2-user/viatuta /home/ec2-user/viatuta/data
      Tags:
        - { Key: Name, Value: viatuta }
        - { Key: Project, Value: viatuta }

  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref Instance
      Tags:
        - { Key: Name, Value: viatuta }
        - { Key: Project, Value: viatuta }

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      Tags:
        - { Key: Project, Value: viatuta }

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Assumed by the GitHub Actions deploy job via OIDC; can only run commands on the Viatuta instance.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidcProvider
                - !GetAtt GitHubOidcProvider.Arn
                - !Ref ExistingOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepo}:environment:${GitHubEnvironment}"
      Policies:
        - PolicyName: run-deploy-command
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: SendCommandToViatutaInstanceOnly
                Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Instance}"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript"
              # These two read APIs do not support resource-level permissions.
              - Sid: ReadCommandResult
                Effect: Allow
                Action:
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                Resource: "*"
      Tags:
        - { Key: Project, Value: viatuta }

Outputs:
  PublicIp:
    Description: Point the viatuta A record in Squarespace DNS at this address.
    Value: !Ref ElasticIp
  InstanceId:
    Description: Set as the DEPLOY_INSTANCE_ID variable in the GitHub production environment.
    Value: !Ref Instance
  DeployRoleArn:
    Description: Set as the AWS_DEPLOY_ROLE_ARN variable in the GitHub production environment.
    Value: !GetAtt DeployRole.Arn
  SessionCommand:
    Description: Shell access without SSH.
    Value: !Sub "aws ssm start-session --target ${Instance} --region ${AWS::Region}"
