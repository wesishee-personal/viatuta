# Production stack. Runs on the VPS from images built by CI (see
# .github/workflows/deploy.yml); the server never needs the source tree.
# Secrets come from a .env file next to this one — see deploy/README.md.
services:
  db:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: viatuta
      POSTGRES_USER: viatuta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viatuta -d viatuta"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    image: ${API_IMAGE:?set by deploy}:${TAG:-latest}
    depends_on:
      db:
        condition: service_healthy
    environment:
      VIATUTA_ADDR: ":8080"
      VIATUTA_DATABASE_URL: "postgres://viatuta:${POSTGRES_PASSWORD}@db:5432/viatuta?sslmode=disable"
      VIATUTA_ENV: production
      VIATUTA_LOG_LEVEL: info
      VIATUTA_JWT_SECRET: ${VIATUTA_JWT_SECRET:?set in .env}
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:?set by deploy}:${TAG:-latest}
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  # One-off operator CLI (ingest / score-edges). Not started by `up`:
  #   docker compose -f docker-compose.prod.yml run --rm cli /app/viatuta ingest-osm --input /app/data/austin.osm.pbf
  #   docker compose -f docker-compose.prod.yml run --rm cli /app/viatuta score-edges
  # then `docker compose -f docker-compose.prod.yml restart api`.
  cli:
    image: ${API_IMAGE}:${TAG:-latest}
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      VIATUTA_DATABASE_URL: "postgres://viatuta:${POSTGRES_PASSWORD}@db:5432/viatuta?sslmode=disable"
      VIATUTA_LOG_LEVEL: info
    volumes:
      - ./data:/app/data
    entrypoint: ["/app/docker-entrypoint.sh"]
    command: ["/app/viatuta", "graph-stats"]

volumes:
  db-data:
  caddy-data:
  caddy-config:
