name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Let a running deploy finish; queue at most one more.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      api_image: ${{ steps.names.outputs.api }}
      web_image: ${{ steps.names.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - id: names
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "api=${REGISTRY}/${repo}-api" >> "$GITHUB_OUTPUT"
          echo "web=${REGISTRY}/${repo}-web" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.names.outputs.api }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          push: true
          build-args: |
            VITE_MAPBOX_TOKEN=${{ secrets.VITE_MAPBOX_TOKEN }}
          tags: ${{ steps.names.outputs.web }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://viatuta.wesishee.com
    # id-token lets the job request an OIDC token; packages is read-only because
    # the token is handed to the instance only to pull the images.
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: viatuta-deploy-${{ github.run_id }}
      - name: Pull and restart over SSM
        env:
          API_IMAGE: ${{ needs.build.outputs.api_image }}
          WEB_IMAGE: ${{ needs.build.outputs.web_image }}
          TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMPOSE_B64="$(base64 -w0 docker-compose.prod.yml)"
          {
            printf 'export API_IMAGE=%q WEB_IMAGE=%q TAG=%q GHCR_USER=%q GHCR_TOKEN=%q COMPOSE_B64=%q\n' \
              "$API_IMAGE" "$WEB_IMAGE" "$TAG" "$GHCR_USER" "$GHCR_TOKEN" "$COMPOSE_B64"
            cat deploy/remote-deploy.sh
          } > payload.sh

          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 600 \
            --comment "viatuta deploy ${GITHUB_SHA::7}" \
            --parameters "$(jq -n --rawfile s payload.sh '{commands: [$s]}')" \
            --query Command.CommandId --output text)"
          rm -f payload.sh

          status=Pending
          for _ in $(seq 1 120); do
            sleep 5
            status="$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '{status: Status, stdout: StandardOutputContent, stderr: StandardErrorContent}' --output yaml
          [ "$status" = Success ]
      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            if curl -fsS https://viatuta.wesishee.com/readyz; then exit 0; fi
            sleep 6
          done
          echo "readyz did not pass" >&2
          exit 1
