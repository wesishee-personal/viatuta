version: "2"
sql:
  - engine: "postgresql"
    # sqlc reads the migrations to learn the schema, then reads queries/
    # to learn what you want to run, and generates typed Go for each.
    schema: "db/migrations"
    queries: "internal/store/queries"
    gen:
      go:
        package: "gen"
        out: "internal/store/gen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
