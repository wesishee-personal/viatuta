name: Viatuta
options:
  bundleIdPrefix: app.viatuta
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Viatuta:
    type: application
    platform: iOS
    sources: [Viatuta]
    info:
      path: Viatuta/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: Viatuta uses your location to show where you are and plan safer bike routes from it.
        NSAppTransportSecurity:
          # Dev only: lets the app call http://localhost. Remove for release
          # builds once the API is served over HTTPS.
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.viatuta.Viatuta
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ViatutaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ViatutaTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.viatuta.ViatutaTests
    dependencies:
      - target: Viatuta
  ViatutaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ViatutaUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.viatuta.ViatutaUITests
    dependencies:
      - target: Viatuta
schemes:
  Viatuta:
    build:
      targets:
        Viatuta: all
    test:
      targets: [ViatutaTests]
  # UI tests drive the whole app against a running API, so they are slow and
  # need `docker compose up`. They have their own scheme to stay out of the
  # normal `Viatuta` test run.
  ViatutaUITests:
    build:
      targets:
        Viatuta: all
    test:
      targets: [ViatutaUITests]
