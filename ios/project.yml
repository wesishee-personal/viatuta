name: Viatuta
options:
  bundleIdPrefix: app.viatuta
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Viatuta:
    type: application
    platform: iOS
    sources: [Viatuta]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.viatuta.Viatuta
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Viatuta uses your location to show where you are and plan safer bike routes from it.
  ViatutaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ViatutaTests]
    dependencies:
      - target: Viatuta
schemes:
  Viatuta:
    build:
      targets:
        Viatuta: all
    test:
      targets: [ViatutaTests]
